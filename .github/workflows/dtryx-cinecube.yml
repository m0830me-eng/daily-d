name: DTRYX Cinecube Alert

on:
  workflow_dispatch:
  schedule:
    # GitHub cron은 UTC 기준. 5분마다 실행.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: dtryx-cinecube-alert
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run DTRYX Cinecube watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DTRYX_DAYS: "21"
          RUN_SECONDS: "290"
          NORMAL_INTERVAL: "7"
          DTRYX_CONCURRENCY: "2"
          PAGE_TIMEOUT_MS: "12000"
          POST_LOAD_WAIT_MS: "3500"
          DTRYX_DEBUG: "1"
        run: |
          python -u dtryx_cinecube_alert.py

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/dtryx_state.json debug_dtryx/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "update dtryx state"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
