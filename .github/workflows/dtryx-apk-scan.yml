name: DTRYX APK API Scan v2

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install apkeep
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import urllib.request

          api = "https://api.github.com/repos/EFForg/apkeep/releases/latest"
          req = urllib.request.Request(
              api,
              headers={
                  "User-Agent": "daily-d-dtryx-scan",
                  "Accept": "application/vnd.github+json",
              },
          )

          with urllib.request.urlopen(req, timeout=20) as r:
              data = json.load(r)

          wanted = None
          for asset in data.get("assets", []):
              name = asset.get("name", "")
              if name == "apkeep-x86_64-unknown-linux-gnu":
                  wanted = asset.get("browser_download_url")
                  break

          if not wanted:
              print("Available assets:")
              for asset in data.get("assets", []):
                  print("-", asset.get("name"))
              raise SystemExit("Linux x86_64 apkeep binary not found")

          print(wanted)
          with open("/tmp/apkeep_url.txt", "w", encoding="utf-8") as f:
              f.write(wanted)
          PY

          APKEEP_URL="$(cat /tmp/apkeep_url.txt)"
          curl -L --fail --retry 3 --connect-timeout 10 --max-time 60 \
            "$APKEEP_URL" \
            -o /usr/local/bin/apkeep

          chmod +x /usr/local/bin/apkeep

          echo "=== apkeep version ==="
          apkeep --version

      - name: Download DTRYX APK with apkeep
        shell: bash
        run: |
          set -euo pipefail

          rm -rf download
          mkdir -p download

          echo "=== Available DTRYX versions ==="
          apkeep -l -a com.dtryx.cinema -d apk-pure || true

          echo "=== Download latest DTRYX ==="
          apkeep \
            -a com.dtryx.cinema \
            -d apk-pure \
            download

          echo "=== Downloaded files ==="
          find download -maxdepth 2 -type f -printf '%p | %s bytes\n' || true

          FILE="$(find download -type f \( -iname '*.apk' -o -iname '*.xapk' \) | head -n 1)"

          if [ -z "$FILE" ]; then
            echo "No APK/XAPK downloaded."
            find download -maxdepth 3 -type f -print || true
            exit 1
          fi

          cp "$FILE" download/com.dtryx.cinema.xapk

          echo "=== Selected file ==="
          ls -lh download/com.dtryx.cinema.xapk
          file download/com.dtryx.cinema.xapk || true
          sha256sum download/com.dtryx.cinema.xapk || true

      - name: Scan APK/XAPK for DTRYX API endpoints
        run: |
          python -u dtryx_apk_scan.py

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtryx-apk-scan-report-v2
          path: |
            dtryx_apk_scan_report.txt
          if-no-files-found: warn
